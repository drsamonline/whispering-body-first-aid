name: Build portable EXE + Android APK

# RETROFIT (Forge): this app now uses the shared, reusable build workflow instead
# of a bespoke one. The app is a single-file PWA at the repo root, so app_src is
# "." — the workflow packages the whole app folder into the EXE and the APK.
#
# (A public repo can only call public reusable workflows, so the shared build
# lives in the public app-builder kit.)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    uses: drsamonline/app-builder/.github/workflows/build.yml@main
    with:
      app_name: whispering-body-first-aid
      app_src: .
