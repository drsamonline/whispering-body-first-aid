<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2C1B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="First-Aid Box">
<link rel="manifest" href="manifest.webmanifest">

<title>First-Aid Box — The Whispering Body</title>
<style>
:root{
 --paper:#F3F0E4; --card:#FFFFFF; --ink:#22301F; --soft:#6C7A66; --faint:#9AA391;
 --sage:#4E6B4A; --deep:#1E2C1B; --gold:#A98A45; --line:#E2DCC8;
 --danger:#A33A2A; --dangerbg:#FBEDEA; --shadow:0 1px 2px rgba(30,44,27,.08),0 6px 18px rgba(30,44,27,.06);
 --r:14px; --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari","Noto Sans Gujarati",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
 font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--paper)}
header{position:sticky;top:0;z-index:20;background:var(--deep);color:#F2EFE3;padding:14px 16px 12px;
 display:flex;align-items:center;justify-content:space-between;gap:10px;
 padding-top:calc(14px + env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:.02em}
.brand .dot{width:11px;height:11px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(169,138,69,.25)}
.langs{display:flex;gap:4px;background:rgba(255,255,255,.10);border-radius:999px;padding:3px}
.langs button{background:none;border:0;color:#D9D6C6;font:inherit;font-size:13px;padding:5px 10px;border-radius:999px;cursor:pointer}
.langs button.on{background:var(--gold);color:#241d0c;font-weight:650}
main{flex:1;padding:16px 16px 92px}
h1.t{font-size:21px;margin:2px 0 12px;letter-spacing:-.01em}
.search{width:100%;padding:13px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);
 font:inherit;color:var(--ink);box-shadow:var(--shadow);margin-bottom:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--soft);
 padding:7px 13px;border-radius:999px;font-size:13.5px;cursor:pointer}
.chip.on{background:var(--sage);border-color:var(--sage);color:#fff;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
 padding:14px 15px;margin-bottom:10px;cursor:pointer;display:block;width:100%;text-align:left;font:inherit;color:inherit}
.card:active{transform:scale(.995)}
.card .q{font-weight:600;font-size:15.5px}
.card .m{color:var(--soft);font-size:13.5px;margin-top:3px}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);
 border:1px solid var(--line);border-radius:999px;padding:2px 9px;margin-bottom:8px}
h2.sec{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:22px 0 8px}
.rem{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
 padding:14px 15px;margin-bottom:10px}
.rem .nm{font-weight:700;font-size:16px}
.rem .row{display:flex;gap:8px;margin-top:8px;font-size:14px}
.rem .k{color:var(--gold);font-weight:650;min-width:74px;flex:0 0 auto}
.rem .v{color:var(--ink)}
.rem .ky{color:var(--soft)}
.note{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;
 font-size:14px;color:var(--soft);margin-top:14px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--sage);
 font:inherit;font-weight:600;padding:6px 0;margin-bottom:6px;cursor:pointer}
.emerg{background:var(--dangerbg);border:1px solid #E8C6BE;border-radius:var(--r);padding:15px}
.emerg h1{color:var(--danger);font-size:20px;margin:0 0 6px}
.emerg p{color:#6d3227;font-size:14.5px;margin:0 0 12px}
.emerg ul{margin:0;padding-left:20px}
.emerg li{margin:7px 0;color:#4a2a22;font-weight:550}
.sos{display:block;width:100%;margin-top:14px;background:var(--danger);color:#fff;border:0;border-radius:12px;
 padding:15px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;text-align:center;text-decoration:none}
.gsec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
 padding:14px 15px;margin-bottom:10px}
.gsec h3{margin:0 0 8px;font-size:15.5px}
.gsec p{margin:0 0 9px;font-size:14.5px;color:#3a463a}
.gsec ul{margin:0;padding-left:19px}
.gsec li{margin:6px 0;font-size:14.5px;color:#3a463a}
.gsec .lab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:650}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
 display:flex;max-width:560px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;border:0;font:inherit;color:var(--soft);padding:11px 4px 10px;cursor:pointer;
 display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;letter-spacing:.02em}
nav.tabs button .ic{font-size:19px;line-height:1}
nav.tabs button.on{color:var(--sage);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(30,44,27,.55);display:flex;align-items:center;justify-content:center;
 padding:22px;z-index:60}
.modal .box{background:var(--card);border-radius:18px;max-width:440px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h2{margin:0 0 10px;font-size:19px}
.modal p{font-size:14.5px;color:#3a463a;margin:0 0 16px}
.modal button{width:100%;background:var(--sage);color:#fff;border:0;border-radius:12px;padding:14px;font:inherit;
 font-weight:650;font-size:16px;cursor:pointer}
.foot{text-align:center;color:var(--faint);font-size:12px;margin:22px 4px 6px;line-height:1.5}
.hide{display:none}
</style>
</head>

is called 1C.", "The process is repeated. Each time, one part of the last dilution goes into ninety-nine parts of fresh alcohol and water, and the bottle is shaken again. Thirty such steps give 30C; two hundred give 200C. The shaking, not the quantity of substance, is the point of the ritual: classical practice holds that it releases the power of the remedy.", "Only at the end is the liquid put on the pills. Sugar globules are spread in a shallow dish, a few drops of the chosen potency are poured over them, and they are rolled until every pill is coated, then left to dry. The globules are porous, so they hold the liquid. Size thirty is simply the name for that small pill."], "carry": ["Keep the box cool, dark and dry — a cupboard away from the kitchen, not a windowsill or a car.", "Keep it away from strong smells. Classical practice treats camphor, menthol, perfume, eucalyptus and strong spices as things that can cancel a remedy.", "Label every remedy with its name and its potency, and keep the bottles upright and separate.", "Never tip globules into your hand. Shake them into the bottle cap, and from the cap into the mouth.", "Keep one remedy out at a time, and put it back before you reach for the next."], "use": ["Give on a clean mouth: leave about fifteen minutes either side of a dose free of coffee, mint, tobacco or strong flavours.", "Give one remedy and watch. If the picture changes, the remedy may change with it.", "Stop when the person is clearly better. Do not keep repeating a remedy that has finished its work.", "Write down what you gave and what happened. Your own notes become the best repertory you will own."], "dose": "Dose: three to four globules of 30C (or the potency shown) at one time. For an acute complaint, repeat every two to four hours, and less often as it settles. For a long-standing complaint, space the doses eight to twelve hours apart.", "liquid": "The liquid potencies are what you buy; the globules are what you give. Keep both if you can, and label every bottle with its remedy and its potency.", "one_rule": "One remedy at a time, chosen for the whole picture — never a handful thrown at the body in hope.", "urgent": "This is a home first-aid box, not a hospital. For a deep or large burn, bleeding that will not stop, a fever in an infant, difficulty breathing, a head injury, or anything that frightens you, seek conventional medical care first. The box is an addition to that care, never a substitute.", "limit": "A first-aid box is not a diagnosis. It is for minor, familiar, self-limiting complaints, and it does not cover fractures, deep wounds, dehydration or infection. When a case does not fit the box, the box is not the answer — a clinician is."}, "hi": {"how": ["E इस बॉक्स का हर उपाय एक मदर टिंचर के रूप में शुरू हुआ — कोई पौधा, खनिज या जानवरों का अर्क, जिसे भिगोकर और छानकर तैयार किया जाता है। फिर क्लासिकल होम्योपैथी कुछ अलग करती है: यह दवा को कमज़ोर बनाकर और मज़बूत बनाती है। टिंचर के एक हिस्से को निन्यानवे हिस्से अल्कोहल और पानी के साथ मिलाया जाता है, और बोतल को ज़ोर से हिलाया जाता है। इस एक कदम को 1C कहा जाता है।", "इस प्रक्रिया को दोहराया जाता है। हर बार, पिछली डाइल्यूशन का एक हिस्सा निन्यानवे हिस्से ताज़े अल्कोहल और पानी में जाता है, और बोतल को फिर से हिलाया जाता है। ऐसी तीस बार करने पर 30C मिलता है; दो सौ बार करने पर 200C मिलता है। हिलाना, न कि पदार्थ की मात्रा, इस प्रक्रिया का मुख्य हिस्सा है: क्लासिकल मान्यता यह है कि इससे उपाय की शक्ति बाहर आती है।", "अंत में ही लिक्विड को गोलियों पर डाला जाता है। चीनी के ग्लोब्यूल्स को एक उथली डिश में फैलाया जाता है, चुनी हुई पोटेंसी की कुछ बूंदें उन पर डाली जाती हैं, और उन्हें तब तक रोल किया जाता है जब तक कि हर गोली पर कोटिंग न हो जाए, फिर उन्हें सूखने के लिए छोड़ दिया जाता है। ग्लोब्यूल्स छिद्रपूर्ण होते हैं, इसलिए वे लिक्विड को सोख लेते हैं। 'साइज तीस' (Size thirty) बस उस छोटी गोली का नाम है।"], "carry": ["बॉक्स को ठंडा, अंधेरा और सूखा रखें — किचन से दूर किसी अलमारी में, खिड़की या कार में नहीं।", "इसे तेज़ महक से दूर रखें। क्लासिकल मान्यता के अनुसार कपूर, मेंथॉल, परफ्यूम, नीलगिरी और तेज़ मसालों की महक उपाय का असर खत्म कर सकती है।", "हर उपाय पर उसका नाम और पोटेंसी का लेबल लगाएं, और बोतलों को सीधा और अलग-अलग रखें।", "कभी भी ग्लोब्यूल्स को सीधे अपने हाथ में न डालें। उन्हें हिलाकर बोतल के ढक्कन में डालें, और ढक्कन से सीधे मुंह में।", "एक बार में एक ही उपाय बाहर रखें, और अगला उपाय लेने से पहले उसे वापस रख दें।"], "use": ["साफ मुंह पर दें: खुराक से लगभग पंद्रह मिनट पहले और बाद में कॉफी, पुदीना, तंबाकू या तेज़ स्वाद वाली चीज़ों से बचें।", "एक उपाय दें और देखें। अगर स्थिति बदलती है, तो उपाय भी बदल सकता है।", "जब व्यक्ति में साफ तौर पर सुधार हो जाए तो रोक दें। जो उपाय अपना काम पूरा कर चुका हो, उसे बार-बार न दें।", "लिख लें कि आपने क्या दिया और क्या हुआ। आपके अपने नोट्स आपके लिए सबसे अच्छी डायरी बन जाएंगे।"], "dose": "खुराक: एक बार में 30C (या दिखाई गई पोटेंसी) के तीन से चार ग्लोब्यूल्स। किसी तेज़ परेशानी के लिए, हर दो से चार घंटे में दोहराएं, और जैसे-जैसे आराम मिले, कम करते जाएं। लंबे समय से चली आ रही परेशानी के लिए, खुराक के बीच आठ से बारह घंटे का अंतर रखें।", "liquid": "आप लिक्विड पोटेंसी खरीदते हैं; ग्लोब्यूल्स आप देते हैं। हो सके तो दोनों रखें, और हर बोतल पर उसके उपाय और पोटेंसी का लेबल लगाएं।", "one_rule": "एक समय में एक उपाय, पूरी स्थिति को देखकर चुना गया — शरीर पर उम्मीद में मुट्ठी भर उपाय फेंकना कभी नहीं।", "urgent": "यह एक होम फर्स्ट-एड बॉक्स है, अस्पताल नहीं। गहरे या बड़े जले हुए घाव, लगातार बहता खून, छोटे बच्चे में बुखार, सांस लेने में तकलीफ, सिर की चोट, या कुछ भी जो आपको डराए, उसके लिए सबसे पहले डॉक्टर के पास जाएं। यह बॉक्स उस इलाज के साथ एक मदद है, कभी भी उसका विकल्प नहीं।", "limit": "यह किताब होम्योपैथिक प्रैक्टिस के बारे में सामान्य जानकारी देती है। यह किसी योग्य डॉक्टर के निदान या इलाज का विकल्प नहीं है। होम्योपैथी के सबूतों को लेकर विवाद है, और यह किताब मापे गए क्लिनिकल दावों के बजाय वही बताती है जो परंपरा सिखाती है।"}, "gu": {"how": ["Every remedy in this box began as a mother tincture — એક છોડ, ખનિજ અથવા પ્રાણીનો પદાર્થ, પલાળીને ગાળેલો. ક્લાસિકલ હોમિયોપેથી પછી કંઈક અલગ કરે છે: તે દવાને નબળી બનાવીને વધુ મજબૂત બનાવે છે. ટિંકચરના એક ભાગને 99 ભાગ આલ્કોહોલ અને પાણી સાથે ભેળવવામાં આવે છે, અને બોટલને જોરથી હલાવવામાં આવે છે. તે એક પગલાને 1C કહેવાય છે.", "આ પ્રક્રિયાનું પુનરાવર્તન થાય છે. દર વખતે, છેલ્લી વખતના પાતળા કરેલા એક ભાગને 99 ભાગ તાજા આલ્કોહોલ અને પાણીમાં ભેળવવામાં આવે છે, અને બોટલને ફરીથી હલાવવામાં આવે છે. આવી 30 વખત કરવાથી 30C મળે છે; 200 વખત કરવાથી 200C મળે છે. હલાવવું, પદાર્થની માત્રા નહીં, એ આ પ્રક્રિયાનો મુખ્ય ભાગ છે: ક્લાસિકલ માન્યતા છે કે તેનાથી ઉપાયની શક્તિ બહાર આવે છે.", "અંતે જ પ્રવાહીને ગોળીઓ પર મૂકવામાં આવે છે. ખાંડની ગોળીઓને એક છીછરા વાસણમાં ફેલાવવામાં આવે છે, પસંદ કરેલી શક્તિના થોડા ટીપાં તેના પર નાખવામાં આવે છે, અને દરેક ગોળી પર પડ (coat) ન ચડે ત્યાં સુધી તેને ગોળ ફેરવવામાં આવે છે, પછી તેને સુકાવા માટે છોડી દેવામાં આવે છે. ગોળીઓ છિદ્રાળુ હોય છે, તેથી તે પ્રવાહીને પકડી રાખે છે. સાઈઝ 30 એ ફક્ત તે નાની ગોળીનું નામ છે."], "carry": ["બોક્સને ઠંડુ, અંધારું અને સૂકું રાખો — રસોડાથી દૂર કબાટમાં, બારી પાસે કે કારમાં નહીં.", "તેને તીવ્ર ગંધથી દૂર રાખો. ક્લાસિકલ માન્યતા મુજબ કપૂર, મેન્થોલ, પરફ્યુમ, નીલગિરી અને તીવ્ર મસાલા એવી વસ્તુઓ છે જે ઉપાયની અસરને નષ્ટ કરી શકે છે.", "દરેક ઉપાય પર તેનું નામ અને તેની શક્તિ લખો, અને બોટલોને સીધી અને અલગ રાખો.", "ક્યારેય ગોળીઓને તમારા હાથમાં ન લો. તેને બોટલના ઢાંકણામાં નાખો, અને ઢાંકણામાંથી મોંમાં નાખો.", "એક સમયે એક જ ઉપાય બહાર કાઢો, અને આગળનો ઉપાય લેતા પહેલા તેને પાછો મૂકી દો."], "use": ["સ્વચ્છ મોંમાં આપો: કોફી, ફુદીનો, તમાકુ કે તીવ્ર સ્વાદવાળી વસ્તુઓથી ડોઝની 15 મિનિટ પહેલાં અને પછીનો સમય ખાલી રાખો.", "એક ઉપાય આપો અને જુઓ. જો સ્થિતિ બદલાય, તો ઉપાય પણ બદલાઈ શકે છે.", "જ્યારે વ્યક્તિ સ્પષ્ટપણે સારી થઈ જાય ત્યારે બંધ કરો. જે ઉપાયનું કામ પૂરું થઈ ગયું હોય તેને વારંવાર આપવાનું ચાલુ ન રાખો.", "તમે શું આપ્યું અને શું થયું તે લખી રાખો. તમારી પોતાની નોંધો જ તમારા માટે શ્રેષ્ઠ રેપર્ટરી (repertory) બનશે."], "dose": "ડોઝ: એક સમયે 30C (અથવા બતાવેલી શક્તિ) ની 3 થી 4 ગોળીઓ. ગંભીર તકલીફ માટે, દર 2 થી 4 કલાકે પુનરાવર્તન કરો, અને જેમ તે મટે તેમ ઓછી વાર આપો. લાંબા સમયથી ચાલતી તકલીફ માટે, ડોઝ વચ્ચે 8 થી 12 કલાકનો ગાળો રાખો.", "liquid": "પ્રવાહી શક્તિઓ તમે ખરીદો છો; ગોળીઓ તમે આપો છો. જો શક્ય હોય તો બંને રાખો, અને દરેક બોટલ પર તેનો ઉપાય અને તેની શક્તિ લખો.", "one_rule": "એક સમયે એક જ ઉપાય, આખી સ્થિતિ જોઈને પસંદ કરો — આશામાં શરીરને મુઠ્ઠીભર ગોળીઓ ન નાખી દો.", "urgent": "આ ઘરનો ફર્સ્ટ-એડ બોક્સ છે, હોસ્પિટલ નહીં. ઊંડી કે મોટી દાઝ, લોહી નીકળતું બંધ ન થાય, નાના બાળકને તાવ આવે, શ્વાસ લેવામાં તકલીફ પડે, માથામાં ઈજા થાય, અથવા તમને ડર લાગે તેવી કોઈપણ પરિસ્થિતિમાં, પહેલાં સામાન્ય તબીબી સારવાર લો. આ બોક્સ તે સારવારમાં વધારો છે, ક્યારેય વિકલ્પ નહીં.", "limit": "ફર્સ્ટ-એડ બોક્સ એ નિદાન નથી. તે નાની, જાણીતી, જાતે જ મટી જતી તકલીફો માટે છે, અને તે ફ્રેક્ચર, ઊંડા ઘા, ડિહાઇડ્રેશન કે ઇન્ફેક્શનને આવરી લેતું નથી. જ્યારે કોઈ કિસ્સો બોક્સમાં ન બેસે, ત્યારે બોક્સ જવાબ નથી — ડૉક્ટર છે."}}, "titles": {"en": "The Home First-Aid Box", "hi": "घरेलू फ़र्स्ट-एड बॉक्स", "gu": "ઘરગથ્થુ પ્રાથમિક સારવાર પેટી"}};

function remedyCard(r){
  return `<div class="rem"><div class="nm">${esc(r.name)}</div>
   <div class="row"><div class="k">${esc(T('for_label'))}</div><div class="v">${esc(r.for)}</div></div>
   <div class="row"><div class="k">${esc(T('keynote_label'))}</div><div class="v ky">${esc(r.keynote)}</div></div></div>`;
}
function viewFind(){
  const q=S.q.trim().toLowerCase();
  const comps=DATA.complaints[S.lang];
  const cats=[...new Set(comps.map(c=>c.cat))];
  const list=comps.filter(c=>!q||c.q.toLowerCase().includes(q)||c.r.join(' ').toLowerCase().includes(q));
  if(S.detail){
    const c=S.detail;
    return `<button class="back" data-back="1">‹ ${esc(T('back'))}</button>
      <span class="tag">${esc(c.cat)}</span><h1 class="t">${esc(c.q)}</h1>
      ${matched(c.r).map(remedyCard).join('')}
      <div class="note">${esc(T('source_note'))}</div>`;
  }
  const chips=cats.map(c=>`<span class="chip" data-cat="${esc(c)}">${esc(c)}</span>`).join('');
  const cards=list.map(c=>`<button class="card" data-cq="${esc(c.q)}"><div class="q">${esc(c.q)}</div>
     <div class="m">${esc(c.r.join(' · '))}</div></button>`).join('')||`<div class="note">${esc(T('no_results'))}</div>`;
  return `<h1 class="t">${esc(T('whats_wrong'))}</h1>
   <input class="search" id="q" placeholder="${esc(T('search_ph'))}" value="${esc(S.q)}">
   <div class="chips">${chips}</div>${cards}`;
}
function viewBox(){
  const q=S.q.trim().toLowerCase();
  if(S.detail) return `<button class="back" data-back="1">‹ ${esc(T('back'))}</button>${remedyCard(S.detail)}
     <div class="note">${esc(T('source_note'))}</div>`;
  let html=`<h1 class="t">${esc(T('tab_box'))}</h1>
    <input class="search" id="q" placeholder="${esc(T('search_ph'))}" value="${esc(S.q)}">
    <div class="m" style="color:var(--soft);font-size:13.5px;margin:-6px 0 10px">${esc(T('box_intro'))}</div>`;
  DATA.box[S.lang].forEach(g=>{
    const rs=g.remedies.filter(r=>!q||r.name.toLowerCase().includes(q)||r.for.toLowerCase().includes(q));
    if(!rs.length)return;
    html+=`<h2 class="sec">${esc(g.name)}</h2>`+rs.map(r=>`<button class="card" data-rem="${esc(r.name)}">
       <div class="q">${esc(r.name)}</div><div class="m">${esc(r.for)}</div></button>`).join('');
  });
  return html;
}
function viewEmergency(){
  const items=(T('emergency_list')||'').split('|').filter(Boolean);
  return `<div class="emerg"><h1>${esc(T('emergency_title'))}</h1><p>${esc(T('emergency_intro'))}</p>
   <ul>${items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>
   <a class="sos" href="tel:112">Call 112 &middot; 108</a></div>
   <div class="note">${esc(T('source_note'))}</div>`;
}
function viewGuide(){
  const g=DATA.guide[S.lang];
  const li=a=>a&&a.length?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'';
  return `<h1 class="t">${esc(T('tab_guide'))}</h1>
   <div class="gsec"><h3>${esc(T('guide_dose'))}</h3><p>${esc(g.dose)}</p>
     ${g.one_rule?`<p style="color:var(--gold);font-weight:600">${esc(g.one_rule)}</p>`:''}</div>
   <div class="gsec"><h3>${esc(T('guide_how'))}</h3>${g.how.map(p=>`<p>${esc(p)}</p>`).join('')}
     ${g.liquid?`<p style="color:var(--soft)">${esc(g.liquid)}</p>`:''}</div>
   <div class="gsec"><h3>${esc(T('guide_carry'))}</h3>${li(g.carry)}</div>
   <div class="gsec"><h3>${esc(T('guide_use'))}</h3>${li(g.use)}</div>
   <div class="gsec"><h3>${esc(T('guide_limit'))}</h3><p>${esc(g.limit)}</p></div>
   <div class="note">${esc(T('source_note'))}</div>`;
}
function render(){
  const v={find:viewFind,box:viewBox,emergency:viewEmergency,guide:viewGuide}[S.tab]();
  $('#app').innerHTML=header()+`<main>${v}</main>`+tabs();
  const qi=$('#q'); if(qi){qi.oninput=e=>{S.q=e.target.value;const p=e.target.selectionStart;render();const n=$('#q');if(n){n.focus();n.setSelectionRange(p,p);}};}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-l],[data-tab],[data-cq],[data-rem],[data-back],[data-cat]');
  if(!b)return;
  if(b.dataset.l){S.lang=b.dataset.l;localStorage.setItem('fab_lang',S.lang);S.detail=null;render();}
  else if(b.dataset.tab){S.tab=b.dataset.tab;S.detail=null;S.q='';render();}
  else if(b.dataset.cq){const c=DATA.complaints[S.lang].find(x=>x.q===b.dataset.cq);S.detail=c;render();window.scrollTo(0,0);}
  else if(b.dataset.rem){S.detail=findRemedy(b.dataset.rem);render();window.scrollTo(0,0);}
  else if(b.dataset.back){S.detail=null;render();}
  else if(b.dataset.cat){S.q=b.dataset.cat;render();}
});
function safety(){
  if(localStorage.getItem('fab_safe'))return;
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="box"><h2>${esc(T('safety_title'))}</h2><p>${esc(T('safety_body'))}</p>
    <button id="ok">${esc(T('safety_ok'))}</button></div>`;
  document.body.appendChild(m);
  $('#ok',m).onclick=()=>{localStorage.setItem('fab_safe','1');m.remove();};
}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
render();safety();
</script>
</body>
</html>
