chip.on{background:var(--sage);border-color:var(--sage);color:#fff;font-weight:600}.card{border-radius:var(--r);box-shadow:var(--shadow);padding:14px 15px;margin-bottom:10px;display:block;width:100%;text-align:left;font:inherit;color:inherit}.card:active{transform:scale(.995)}.card .q{font-weight:600;font-size:15.5px}.card .m{color:var(--soft);font-size:13.5px;margin-top:3px}.card,.rem,.tag{border:1px solid var(--line)}.tag,h2.sec{text-transform:uppercase;color:var(--gold)}.tag{display:inline-block;font-size:11px;letter-spacing:.06em;border-radius:999px;padding:2px 9px;margin-bottom:8px}h2.sec{font-size:12px;letter-spacing:.14em;margin:22px 0 8px}.rem{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 15px;margin-bottom:10px}.rem .nm{font-weight:700;font-size:16px}.rem .row{display:flex;gap:8px;margin-top:8px;font-size:14px}.rem .k{color:var(--gold);font-weight:650;min-width:74px;flex:0 0 auto}.rem .v{color:var(--ink)}.note,.rem .ky{color:var(--soft)}.note{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;font-size:14px;margin-top:14px}.back{display:inline-flex;align-items:center;gap:6px;background:0 0;border:0;color:var(--sage);font:inherit;font-weight:600;padding:6px 0;margin-bottom:6px;cursor:pointer}.emerg{background:var(--dangerbg);border:1px solid #e8c6be;border-radius:var(--r);padding:15px}.emerg h1{color:var(--danger);font-size:20px;margin:0 0 6px}.emerg p{color:#6d3227;font-size:14.5px;margin:0 0 12px}.emerg ul{margin:0;padding-left:20px}.emerg li{margin:7px 0;color:#4a2a22;font-weight:550}.sos{display:block;width:100%;margin-top:14px;background:var(--danger);color:#fff;border:0;border-radius:12px;padding:15px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;text-align:center;text-decoration:none}.gsec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 15px;margin-bottom:10px}.gsec h3{margin:0 0 8px;font-size:15.5px}.gsec li,.gsec p,.modal p{margin:0 0 9px;font-size:14.5px;color:#3a463a}.gsec ul{margin:0;padding-left:19px}.gsec li,.modal p{margin:6px 0}.gsec .lab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:650}.modal .box,nav.tabs{background:var(--card)}nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;border-top:1px solid var(--line);display:flex;max-width:560px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}.modal button,nav.tabs button{border:0;font:inherit;cursor:pointer}.modal,nav.tabs button{display:flex;align-items:center}nav.tabs button{flex:1;background:0 0;color:var(--soft);padding:11px 4px 10px;flex-direction:column;gap:3px;font-size:11.5px;letter-spacing:.02em}nav.tabs button .ic{font-size:19px;line-height:1}nav.tabs button.on{color:var(--sage);font-weight:700}.modal{position:fixed;inset:0;background:rgba(30,44,27,.55);justify-content:center;padding:22px;z-index:60}.modal .box{border-radius:18px;max-width:440px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.3)}.modal h2{margin:0 0 10px;font-size:19px}.modal p{margin:0 0 16px}.modal button{width:100%;background:var(--sage);color:#fff;border-radius:12px;padding:14px;font-weight:650;font-size:16px}.foot{text-align:center;color:var(--faint);font-size:12px;margin:22px 4px 6px;line-height:1.5}.hide{display:none}</style>
